[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ligase"
version = "0.2.0"
description = "Ligase: local-first biomedical research agent that joins community tools, private models and hosted data"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Xiaoqian Jiang", email = "xiaoqian.jiang@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "biomedical",
    "genomics",
    "bioinformatics",
    "drug-discovery",
    "ai-agent",
    "clawagents",
    "biomni",
    "llm",
    "alzheimers-disease"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "clawagents>=6.20.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24",
    "requests>=2.31.0",
    "httpx>=0.27",
    "tabulate>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "nest-asyncio>=1.5",
    # Biomni tool library (database, literature, pharmacology, biochemistry modules)
    "biopython>=1.80",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "beautifulsoup4>=4.12",
    "googlesearch-python>=1.2",
    "PyPDF2>=3.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Heavy single-cell / protein-LM stack for the Biomni genomics module.
genomics = [
    "torch>=2.1",
    "fair-esm>=2.0",
    "scanpy>=1.9",
    "gseapy>=1.0",
    "gget>=0.28",
    "pybiomart>=0.2",
]
providers = [
    "openai>=1.0.0",
    "google-genai>=0.1.0",
    "anthropic>=0.18.0",
    "langchain-anthropic>=0.2",
]
all = [
    "ligase[genomics,providers]",
]
dev = [
    "pytest>=8",
]

[project.scripts]
ligase = "ligase.cli:main"

[project.urls]
Homepage = "https://github.com/x1jiang/ligase"
Repository = "https://github.com/x1jiang/ligase"
Issues = "https://github.com/x1jiang/ligase/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ligase*"]
